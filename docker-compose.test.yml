# Изолированные сервисы только для разработки и CI. Не используют production volumes.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth_test
      POSTGRES_PASSWORD: auth_test_only
      POSTGRES_DB: auth_test
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_test -d auth_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${TEST_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
