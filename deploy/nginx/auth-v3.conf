# Замените auth.example.com, затем подключите TLS через certbot --nginx.
# Порт должен совпадать с HOST_PORT в .env. После установки TLS настройте
# редирект HTTP -> HTTPS средствами certbot.
server {
    listen 80;
    server_name auth.example.com;
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:3016;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Один nginx: переписываем, не принимая цепочку, присланную клиентом.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
